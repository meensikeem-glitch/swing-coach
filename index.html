<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1310">
<title>스윙 코치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: camera on top, big feedback card under it (readable from the tee), settings folded below */
:root{
  --bg:#0d1310; --panel:#16201a; --fg:#eef3ee; --muted:#93a398; --line:#26342b;
  --accent:#ff6a33; --good:#5fd38a; --mid:#f2c94c; --bad:#ff6a6a;
  --font:"IBM Plex Sans KR","Noto Sans KR",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding-inline:14px;padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{margin:0;font-size:20px}
h1 b{color:var(--accent)}
.cost{font-family:var(--mono);font-size:13px;color:var(--muted)}
.cam{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:9/16;max-height:52vh;width:100%;margin:0 auto}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.pill{position:absolute;left:10px;top:10px;padding:4px 10px;border-radius:99px;background:rgba(0,0,0,.65);font-weight:700;font-size:14px}
.pill[data-s="live"]{color:var(--good)} .pill[data-s="swing"]{color:var(--mid)} .pill[data-s="busy"]{color:var(--accent)} .pill[data-s="off"]{color:var(--muted)}
.meter{position:absolute;left:10px;right:10px;bottom:10px;height:6px;background:rgba(255,255,255,.15);border-radius:9px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--mid)}
.fb{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px}
.fb .top{display:flex;align-items:baseline;gap:12px}
.score{font-size:44px;font-weight:700;font-family:var(--mono);line-height:1}
.verdict{font-size:20px;font-weight:700}
.fb .cause{font-size:17px}
.fb .cue{font-size:22px;font-weight:700;color:var(--accent)}
.fb .meta{font-size:13px;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font-family:var(--font)}
.btn{appearance:none;border:0;border-radius:12px;padding:16px;font-size:17px;font-weight:700;background:var(--accent);color:#1a0a03;cursor:pointer}
.btn.alt{background:var(--panel);color:var(--fg);border:1px solid var(--line)}
.btn:disabled{opacity:.4}
.btn.rec{background:var(--good);color:#06180d}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
details{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
summary{font-weight:700;cursor:pointer}
.form{display:flex;flex-direction:column;gap:12px;margin-top:12px}
label{font-size:13px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:6px}
input,select,textarea{width:100%;min-width:0;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font:16px var(--font)}
textarea{min-height:64px;resize:vertical}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.chip{appearance:none;border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:9px;padding:9px 0;font-weight:700;font-size:14px;cursor:pointer;min-width:0}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chk{flex-direction:row;align-items:center;gap:10px;color:var(--fg);font-size:15px}
.chk input{width:22px;height:22px}
.note{font-size:13px;color:var(--muted)}
.hist{display:flex;flex-direction:column;gap:10px}
.h{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.h img{width:100%;border-radius:8px}
.h a{color:var(--accent);font-weight:700;font-size:14px}
.qa{font-size:15px;color:var(--fg)}
.err{color:var(--bad)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>스윙 <b>코치</b></h1><span class="cost" id="cost">오늘 0원</span></header>

  <div class="cam">
    <video id="video" playsinline muted autoplay></video>
    <span class="pill" id="pill" data-s="off">꺼짐</span>
    <div class="meter"><i id="meterI"></i></div>
  </div>

  <section class="fb" aria-live="polite">
    <div class="top"><span class="score" id="fScore">–</span><span class="verdict" id="fVerdict">시작을 누르고 어드레스하세요</span></div>
    <div class="cause" id="fCause">스윙을 하면 자동으로 감지해서 피드백해요.</div>
    <div class="cue" id="fCue"></div>
    <div class="meta" id="fMeta"></div>
  </section>

  <div class="row">
    <button class="btn" id="startBtn" type="button">시작</button>
    <button class="btn alt" id="askBtn" type="button">🎤 질문하기</button>
  </div>
  <div class="note" id="askNote">이어폰 재생/정지 버튼을 눌러도 질문할 수 있어요 (지원되는 이어폰).</div>

  <details id="setup">
    <summary>설정</summary>
    <div class="form">
      <label>Anthropic API 키<input type="password" id="key" autocomplete="off" placeholder="sk-ant-..."></label>
      <div class="note">키는 이 폰의 브라우저에만 저장돼요. 이 페이지 주소를 다른 사람에게 알려줘도 키는 넘어가지 않아요.</div>
      <label>모델<select id="model">
        <option value="claude-sonnet-5-5">Sonnet 5.5 (정확, 약 9원/회)</option>
        <option value="claude-haiku-4-5-20251001">Haiku 4.5 (저렴, 약 4원/회)</option>
      </select></label>
      <div><div class="note" style="margin-bottom:6px">클럽</div><div class="chips" id="clubs"></div></div>
      <label>촬영 방향<select id="view"><option value="정면">정면</option><option value="후면">후면 (타겟 뒤쪽)</option></select></label>
      <label>이번 목표<input type="text" id="goal" placeholder="예: 왼골반 뒤로 빼기"></label>
      <label>내 과제 (코치가 참고)<textarea id="tasks">캐스팅(손목이 일찍 풀림), 치킨윙, 골반이 옆으로 밀림, 얼리 익스텐션. 핵심 큐: 왼골반 뒤로. 허리가 안 좋아서 무리한 동작은 피해야 함.</textarea></label>
      <label>피드백 간격<select id="every">
        <option value="1">스윙마다</option><option value="2">2개마다</option><option value="3">3개마다</option><option value="5">5개마다</option>
      </select></label>
      <label>감지 민감도<select id="sens"><option value="1.4">낮음 (오감지 적음)</option><option value="1" selected>보통</option><option value="0.7">높음</option></select></label>
      <label class="chk"><input type="checkbox" id="voice" checked>피드백 소리로 읽기</label>
      <div class="note">키 192cm 기준으로 코칭해요. 폰은 삼각대에 세로로, 머리부터 발까지 다 나오게 2~3m 떨어뜨려 두세요.</div>
    </div>
  </details>

  <section class="hist" id="hist" aria-label="오늘 기록"></section>
</div>

<audio id="silence" loop></audio>

<script>
const $=id=>document.getElementById(id);
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const POS=["P1 어드레스","P2 테이크어웨이","P3 백스윙 중간","P4 탑","P5 다운 초반","P6 딜리버리","P7 임팩트","P8 릴리스","P9 팔로스루","P10 피니시"];
const CLUBS=[["DR","DR","드라이버"],["3W","3W","3번 우드"],["5W","5W","5번 우드"],["UT","UT","유틸리티"],["4I","4","4번 아이언"],["5I","5","5번 아이언"],["6I","6","6번 아이언"],["7I","7","7번 아이언"],["8I","8","8번 아이언"],["9I","9","9번 아이언"],["PW","PW","피칭웨지"],["50","50°","50도 웨지"],["52","52°","52도 웨지"],["56","56°","56도 웨지"],["60","60°","60도 웨지"]];
const PRICE={"claude-sonnet-5-5":[2,10],"claude-haiku-4-5-20251001":[1,5]};const KRW=1400;

/* ---------- 설정 ---------- */
const S={club:ls.get("sc.club","7I"),swingNo:0,sent:0,history:[],lastImg:null,lastFb:null,busy:false,running:false};
["key","model","view","goal","tasks","every","sens"].forEach(id=>{const el=$(id);const v=ls.get("sc."+id,null);if(v!=null)el.value=v;el.addEventListener("change",()=>ls.set("sc."+id,el.value))});
$("voice").checked=ls.get("sc.voice","1")==="1";$("voice").onchange=()=>ls.set("sc.voice",$("voice").checked?"1":"0");
function drawClubs(){$("clubs").innerHTML=CLUBS.map(c=>`<button type="button" class="chip" data-c="${c[0]}" aria-pressed="${c[0]===S.club}">${c[1]}</button>`).join("")}
$("clubs").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;S.club=b.dataset.c;ls.set("sc.club",S.club);drawClubs()};drawClubs();
if(!$("key").value)$("setup").open=true;
const today=new Date().toISOString().slice(0,10);
let costWon=Number(ls.get("sc.cost."+today,"0"));function showCost(){$("cost").textContent=`오늘 약 ${Math.round(costWon)}원`}showCost();
function clubName(){return CLUBS.find(c=>c[0]===S.club)[2]}

/* ---------- 음성 ---------- */
function speak(t){if(!$("voice").checked||!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ko-KR";u.rate=1.05;const ko=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith("ko"));if(ko)u.voice=ko;speechSynthesis.speak(u)}

/* ---------- 카메라 + 링버퍼 ---------- */
const video=$("video");
const FW=216,FH=384,FPS=30,RING=FPS*7;
const ring=[];for(let i=0;i<RING;i++){const c=document.createElement("canvas");c.width=FW;c.height=FH;ring.push({c,t:0,m:0})}
let head=0,count=0;
const tiny=document.createElement("canvas");tiny.width=36;tiny.height=64;const tctx=tiny.getContext("2d",{willReadFrequently:true});
let prevG=null,lastT=0,base=2,sm=0,state="idle",onsetT=0,quietSince=0,peak=0,cooldownUntil=0,wakeLock=null;

async function start(){
  try{
    const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:1080},height:{ideal:1920},frameRate:{ideal:60}},audio:false});
    video.srcObject=st;await video.play();
  }catch(e){setFb({verdict:"카메라를 열 수 없어요",cause:"크롬에서 카메라 권한을 허용했는지, 주소가 https인지 확인하세요."});return}
  S.running=true;$("startBtn").textContent="정지";$("startBtn").classList.add("rec");pill("live","대기 중");
  try{wakeLock=await navigator.wakeLock.request("screen")}catch(e){}
  armEarbuds();
  speak("시작합니다. 어드레스하고 치세요.");
  loop();
}
function stop(){S.running=false;const st=video.srcObject;if(st)st.getTracks().forEach(t=>t.stop());video.srcObject=null;$("startBtn").textContent="시작";$("startBtn").classList.remove("rec");pill("off","꺼짐");try{wakeLock&&wakeLock.release()}catch(e){}}
$("startBtn").onclick=()=>S.running?stop():start();
function pill(s,t){const p=$("pill");p.dataset.s=s;p.textContent=t}

function loop(){
  if(!S.running)return;
  const cb=()=>{tick();loop()};
  if(video.requestVideoFrameCallback)video.requestVideoFrameCallback(cb);else requestAnimationFrame(cb);
}
function tick(){
  const now=performance.now()/1000;if(now-lastT<1/FPS-0.004)return;lastT=now;
  if(!video.videoWidth)return;
  // 프레임 저장 (세로 화면 기준 중앙 잘라내기)
  const vw=video.videoWidth,vh=video.videoHeight,tr=FW/FH;let sw=vw,sh=vh,sx=0,sy=0;
  if(vw/vh>tr){sw=vh*tr;sx=(vw-sw)/2}else{sh=vw/tr;sy=(vh-sh)/2}
  const slot=ring[head];slot.c.getContext("2d").drawImage(video,sx,sy,sw,sh,0,0,FW,FH);slot.t=now;
  // 움직임 계산
  tctx.drawImage(slot.c,0,0,36,64);const d=tctx.getImageData(0,0,36,64).data;const g=new Uint8Array(36*64);
  for(let i=0,j=0;i<d.length;i+=4,j++)g[j]=(d[i]*3+d[i+1]*6+d[i+2])/10;
  let m=0;if(prevG){for(let i=0;i<g.length;i++)m+=Math.abs(g[i]-prevG[i]);m/=g.length}prevG=g;
  slot.m=m;head=(head+1)%RING;count=Math.min(count+1,RING);
  sm=sm*0.6+m*0.4;
  $("meterI").style.width=Math.min(100,sm*6)+"%";
  detect(now);
}
function detect(now){
  const k=Number($("sens").value);
  const hi=Math.max(base*4,base+6)*k,lo=Math.max(base*2,base+2.5)*k;
  if(state==="idle"){
    base=base*0.97+Math.min(sm,base*3)*0.03;
    if(now<cooldownUntil||S.busy)return;
    if(sm>hi){state="active";peak=sm;quietSince=0;onsetT=findOnset(lo,now);pill("swing","스윙 감지")}
  }else{
    peak=Math.max(peak,sm);
    if(sm<lo){if(!quietSince)quietSince=now;if(now-quietSince>0.5)finish(now,hi)}else quietSince=0;
    if(now-onsetT>6){state="idle";pill("live","대기 중")}
  }
}
function frames(t0,t1){const out=[];for(let i=0;i<count;i++){const s=ring[(head-count+i+RING)%RING];if(s.t>=t0&&s.t<=t1)out.push(s)}return out}
function findOnset(lo,now){const f=frames(now-2,now);for(let i=f.length-1;i>=0;i--)if(f[i].m<lo)return f[i].t;return now-1}
function finish(now,hi){
  state="idle";cooldownUntil=now+1;
  const end=quietSince,dur=end-onsetT;
  if(dur<0.6||dur>5||peak<hi*1.3){pill("live","대기 중");return}
  const f=frames(onsetT-0.35,end+0.25);if(f.length<12){pill("live","대기 중");return}
  // 다음 스윙이 링버퍼를 덮어쓰기 전에 복사
  const snap=f.map(s=>{const c=document.createElement("canvas");c.width=FW;c.height=FH;c.getContext("2d").drawImage(s.c,0,0);return{c,t:s.t,m:s.m}});
  S.swingNo++;
  const every=Number($("every").value);
  if(S.swingNo%every!==0){pill("live",`대기 중 · 스윙 ${S.swingNo}`);speak(`${S.swingNo}번`);return}
  handleSwing(snap);
}

/* ---------- P1~P10 고르기 ---------- */
function pickP(f){
  const N=f.length,m=f.map(x=>x.m),s=m.map((_,i)=>{let a=0,n=0;for(let k=-1;k<=1;k++)if(m[i+k]!=null){a+=m[i+k];n++}return a/n});
  const sorted=[...s].sort((a,b)=>a-b),med=sorted[Math.floor(N*0.1)],mx=sorted[N-1],thr=med+0.08*(mx-med);
  let on=s.findIndex(x=>x>thr);if(on<0)on=1;let off=on;for(let i=on;i<N;i++)if(s[i]>thr)off=i;
  const L=Math.max(4,off-on);
  let top=on+Math.round(L*.2);for(let i=on+Math.round(L*.2);i<=Math.min(N-1,on+Math.round(L*.6));i++)if(s[i]<s[top])top=i;
  const p1=Math.max(0,on-2),bs=Math.max(2,top-p1);
  const pred=Math.min(N-1,top+Math.max(2,Math.round(bs/3)));let imp=pred;
  for(let i=Math.max(top+1,pred-Math.round(bs*.12));i<=Math.min(off,pred+Math.round(bs*.08));i++)if(s[i]>s[imp])imp=i;
  const fin=Math.max(imp+2,Math.min(N-1,off+1));
  const lerp=(a,b,t)=>Math.round(a+(b-a)*t);
  return [p1,lerp(p1,top,.35),lerp(p1,top,.68),top,lerp(top,imp,.5),lerp(top,imp,.78),imp,lerp(imp,fin,.12),lerp(imp,fin,.28),fin].map(i=>Math.max(0,Math.min(N-1,i)));
}
function compose(f,idx){
  const cw=FW,ch=FH,gap=6,pad=16,head=S.goal?104:78,W=pad*2+cw*5+gap*4,H=head+ch*2+gap+pad;
  const c=document.createElement("canvas");c.width=W;c.height=H;const x=c.getContext("2d");
  const F='"IBM Plex Sans KR",sans-serif';x.fillStyle="#0d1310";x.fillRect(0,0,W,H);x.textBaseline="top";
  const d=new Date(),p=n=>String(n).padStart(2,"0");
  x.fillStyle="#fff";x.font=`700 30px ${F}`;x.fillText(`${clubName()} · ${$("view").value} · 스윙 #${S.swingNo}`,pad,14);
  x.fillStyle="#93a398";x.font=`500 20px ${F}`;x.fillText(`${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`,pad,52);
  if(S.goal){x.fillStyle="#f2c94c";x.font=`600 20px ${F}`;x.fillText("목표: "+S.goal,pad,78)}
  idx.forEach((fi,k)=>{const px=pad+(k%5)*(cw+gap),py=head+Math.floor(k/5)*(ch+gap);x.drawImage(f[fi].c,px,py,cw,ch);
    x.font=`700 16px ${F}`;const tw=x.measureText(POS[k]).width;x.fillStyle="rgba(0,0,0,.65)";x.fillRect(px+4,py+4,tw+12,24);x.fillStyle="#fff";x.fillText(POS[k],px+10,py+8)});
  return c;
}

/* ---------- Claude 호출 ---------- */
async function callClaude(content,maxTokens,system){
  const key=$("key").value.trim();if(!key)throw new Error("설정에서 API 키를 넣어주세요.");
  const model=$("model").value;
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model,max_tokens:maxTokens,system,messages:[{role:"user",content}]})});
  const j=await r.json();
  if(!r.ok)throw new Error(j.error&&j.error.message||("API 오류 "+r.status));
  const pr=PRICE[model]||[2,10];costWon+=((j.usage.input_tokens*pr[0]+j.usage.output_tokens*pr[1])/1e6)*KRW;ls.set("sc.cost."+today,String(costWon));showCost();
  return j.content.map(c=>c.text||"").join("");
}
function sysPrompt(){
  return `너는 골프 레슨 프로다. 학생은 키 192cm 남성 아마추어(약 100타)다. 학생의 과제: ${$("tasks").value}
이미지는 한 번의 스윙에서 자동으로 뽑은 P1~P10 장면이다(${$("view").value} 촬영, 클럽: ${clubName()}). 장면 선택은 움직임 양 기준이라 1~2개가 조금 어긋날 수 있다.
이번 목표: ${S.goal||"(없음: 가장 큰 문제 하나를 짚어라)"}
최근 피드백: ${S.history.slice(-3).map(h=>`#${h.no} ${h.score}% ${h.cue}`).join(" / ")||"없음"}
반드시 JSON만 출력: {"score":0~100 정수(이번 목표 달성도),"verdict":"됐다"|"반쯤"|"안 됐다","cause":"어느 P에서 무엇이 어땠는지 한 문장(40자 이내)","cue":"다음 스윙에서 생각할 한 마디(15자 이내)"}
한국어, 쉬운 말, 칭찬은 짧게. 허리에 무리가 가는 지시는 하지 마라.`;
}
async function handleSwing(f){
  S.busy=true;pill("busy","분석 중");setFb({verdict:"분석 중…",cause:"",cue:"",score:"…"});
  const idx=pickP(f),img=compose(f,idx);
  const b64=img.toDataURL("image/jpeg",.85).split(",")[1];S.lastImg=b64;
  try{
    const txt=await callClaude([{type:"image",source:{type:"base64",media_type:"image/jpeg",data:b64}},{type:"text",text:`스윙 #${S.swingNo} 피드백을 JSON으로.`}],300,sysPrompt());
    const fb=JSON.parse(txt.slice(txt.indexOf("{"),txt.lastIndexOf("}")+1));
    fb.no=S.swingNo;S.lastFb=fb;S.history.push(fb);setFb(fb);addHist(img,fb);
    speak(`${fb.score}퍼센트. ${fb.cause} 다음엔, ${fb.cue}`);
  }catch(e){setFb({verdict:"피드백 실패",cause:e.message,cue:"",score:"!"});speak("피드백을 받지 못했어요.");addHist(img,null)}
  S.busy=false;cooldownUntil=performance.now()/1000+0.8;pill("live","대기 중");
}
function setFb(fb){
  const sc=$("fScore");sc.textContent=fb.score==null?"–":(typeof fb.score==="number"?fb.score+"%":fb.score);
  sc.style.color=typeof fb.score==="number"?(fb.score>=80?"var(--good)":fb.score>=50?"var(--mid)":"var(--bad)"):"var(--fg)";
  $("fVerdict").textContent=fb.verdict||"";$("fCause").textContent=fb.cause||"";$("fCue").textContent=fb.cue?"다음: "+fb.cue:"";
  $("fMeta").textContent=fb.no?`${clubName()} · 스윙 #${fb.no}`:"";
}
function addHist(img,fb){
  const url=img.toDataURL("image/jpeg",.85),d=new Date(),p=n=>String(n).padStart(2,"0");
  const name=`swing_${today.replace(/-/g,"")}_${p(d.getHours())}${p(d.getMinutes())}_${S.club}_S${p(S.swingNo)}.jpg`;
  const el=document.createElement("div");el.className="h";
  el.innerHTML=`<img alt="스윙 ${S.swingNo} P1~P10"><div class="qa"></div><a download="${name}">사진 저장</a>`;
  el.querySelector("img").src=url;el.querySelector("a").href=url;
  el.querySelector(".qa").textContent=fb?`#${fb.no} ${fb.score}% · ${fb.cause} → ${fb.cue}`:`#${S.swingNo} 피드백 없음`;
  $("hist").prepend(el);
}

/* ---------- 질문하기 ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let listening=false;
function ask(){
  if(!SR){$("askNote").textContent="이 브라우저는 음성 인식을 지원하지 않아요. 크롬을 써주세요.";return}
  if(listening||S.busy)return;
  window.speechSynthesis&&speechSynthesis.cancel();
  const r=new SR();r.lang="ko-KR";r.interimResults=false;r.maxAlternatives=1;listening=true;$("askBtn").textContent="듣는 중…";
  r.onresult=async e=>{const q=e.results[0][0].transcript;$("askBtn").textContent="🎤 질문하기";listening=false;await answer(q)};
  r.onerror=r.onend=()=>{listening=false;$("askBtn").textContent="🎤 질문하기"};
  r.start();
}
async function answer(q){
  setFb({verdict:"질문: "+q,cause:"답을 만드는 중…",cue:"",score:S.lastFb?S.lastFb.score:null});
  const content=[];if(S.lastImg)content.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:S.lastImg}});
  content.push({type:"text",text:`방금 스윙(이미지) 기준으로 답해줘. 질문: ${q}`});
  try{
    const sys=sysPrompt().split("반드시 JSON")[0]+"이어폰으로 들을 답이다. 2~3문장, 짧고 구체적으로. 목록이나 기호 없이 말하듯이.";
    const t=await callClaude(content,250,sys);
    $("fCause").textContent=t;speak(t);
    const el=document.createElement("div");el.className="h";el.innerHTML=`<div class="qa"></div>`;el.firstChild.textContent=`Q. ${q}\nA. ${t}`;el.firstChild.style.whiteSpace="pre-wrap";$("hist").prepend(el);
  }catch(e){$("fCause").textContent=e.message}
}
$("askBtn").onclick=ask;
// 이어폰 버튼으로 질문: 무음 오디오를 틀어 미디어 버튼을 받는다
function armEarbuds(){
  try{
    const a=$("silence");
    if(!a.src){const ctx=new (window.AudioContext||window.webkitAudioContext)();const buf=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate);
      const wav=toWav(buf);a.src=URL.createObjectURL(new Blob([wav],{type:"audio/wav"}));a.volume=0.01}
    a.play().catch(()=>{});
    if("mediaSession" in navigator){
      navigator.mediaSession.metadata=new MediaMetadata({title:"스윙 코치",artist:"이어폰 버튼 = 질문"});
      ["play","pause","nexttrack"].forEach(ac=>{try{navigator.mediaSession.setActionHandler(ac,()=>{a.play().catch(()=>{});ask()})}catch(e){}});
    }
  }catch(e){}
}
function toWav(buf){const n=buf.length,b=new ArrayBuffer(44+n*2),v=new DataView(b),w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,"RIFF");v.setUint32(4,36+n*2,true);w(8,"WAVE");w(12,"fmt ");v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,buf.sampleRate,true);v.setUint32(28,buf.sampleRate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,"data");v.setUint32(40,n*2,true);return b}

Object.defineProperty(S,"goal",{get(){return $("goal").value.trim()}});
